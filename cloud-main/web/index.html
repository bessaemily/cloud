<!DOCTYPE html>
<html>
<head>
  <!--
    Se o aplicativo for publicado em uma subpasta, ajuste o caminho base abaixo.

    O caminho deve começar e terminar com uma barra "/".

    Consulte a documentação do elemento base do HTML para obter mais detalhes.

    O Flutter substitui este valor pelo argumento `--base-href` durante a
    compilação para a Web.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Converse com o Assistente Inteligente.">

  <!-- Metadados e ícones usados em dispositivos móveis. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Assistente Inteligente">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Ícone da página. -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Assistente Inteligente</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    O script "flutter_bootstrap.js" pode ser ajustado para personalizar o início
    do aplicativo ou exibir uma mensagem enquanto ele carrega.

    Consulte a documentação de inicialização do Flutter para a Web.
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
